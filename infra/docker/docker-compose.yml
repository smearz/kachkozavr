services:
  postgres:
    image: postgres:16-alpine
    container_name: kachkozavr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kachkozavr
      POSTGRES_USER: kachkozavr
      POSTGRES_PASSWORD: kachkozavr
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kachkozavr -d kachkozavr"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kachkozavr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
