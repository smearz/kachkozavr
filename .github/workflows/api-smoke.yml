name: API Smoke (Core Loop Slice)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kachkozavr
          POSTGRES_USER: kachkozavr
          POSTGRES_PASSWORD: kachkozavr
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kachkozavr -d kachkozavr"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://kachkozavr:kachkozavr@localhost:5432/kachkozavr
      JWT_SECRET: ci-smoke-secret
      PORT: 4000
      HOST: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma client and sync schema
        working-directory: apps/api
        run: |
          corepack pnpm prisma:generate
          corepack pnpm exec prisma db push --skip-generate

      - name: Start API
        run: |
          corepack pnpm --filter @kachkozavr/api dev > api.log 2>&1 &
          echo $! > api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat api.log
          exit 1

      - name: Run smoke flow
        run: |
          trainer_signup=$(curl -fsS -X POST http://127.0.0.1:4000/auth/trainer/signup \
            -H "content-type: application/json" \
            -d '{"email":"trainer-smoke@example.com","password":"StrongPass123!","displayName":"Smoke Trainer"}')
          echo "$trainer_signup"

          trainer_login=$(curl -fsS -X POST http://127.0.0.1:4000/auth/login \
            -H "content-type: application/json" \
            -d '{"email":"trainer-smoke@example.com","password":"StrongPass123!"}')
          trainer_token=$(echo "$trainer_login" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).token));")

          group_id="grp_smoke_$(date +%s)"
          group_create_sql="INSERT INTO \"Group\" (id, \"trainerId\", name, \"createdAt\") SELECT '$group_id', t.id, 'Smoke Group', NOW() FROM \"Trainer\" t JOIN \"User\" u ON u.id=t.\"userId\" WHERE u.email='trainer-smoke@example.com';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$group_create_sql"

          invite_create=$(curl -fsS -X POST http://127.0.0.1:4000/invites \
            -H "content-type: application/json" \
            -H "authorization: Bearer $trainer_token" \
            -d "{\"groupId\":\"$group_id\",\"expiresInHours\":48,\"maxUses\":1}")
          invite_token=$(echo "$invite_create" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).token));")

          invite_validate_before=$(curl -fsS "http://127.0.0.1:4000/invites/validate?token=$invite_token")
          echo "$invite_validate_before" | grep '"valid":true'

          student_join=$(curl -fsS -X POST http://127.0.0.1:4000/invites/join \
            -H "content-type: application/json" \
            -d "{\"token\":\"$invite_token\",\"email\":\"student-smoke@example.com\",\"password\":\"StrongPass123!\",\"displayName\":\"Smoke Student\"}")
          echo "$student_join" | grep '"role":"student"'
          student_token=$(echo "$student_join" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).token));")

          invite_validate_after=$(curl -fsS "http://127.0.0.1:4000/invites/validate?token=$invite_token")
          echo "$invite_validate_after" | grep '"valid":false'
          echo "$invite_validate_after" | grep '"reason":"used_out"'

          student_id=$(psql "$DATABASE_URL" -t -A -c "SELECT s.id FROM \"Student\" s JOIN \"User\" u ON u.id=s.\"userId\" WHERE u.email='student-smoke@example.com' LIMIT 1;")
          exercise_id="ex_smoke_$(date +%s)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO \"Exercise\" (id, slug, name, category, \"createdAt\", \"updatedAt\") VALUES ('$exercise_id','smoke-pushup','Smoke Pushup','upper',NOW(),NOW());"

          program_create=$(curl -fsS -X POST http://127.0.0.1:4000/programs \
            -H "content-type: application/json" \
            -H "authorization: Bearer $trainer_token" \
            -d "{\"name\":\"Smoke Program\",\"workouts\":[{\"title\":\"Workout A\",\"dayOrder\":1,\"exercises\":[{\"exerciseId\":\"$exercise_id\",\"position\":1,\"plannedReps\":10}]}]}")
          program_id=$(echo "$program_create" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).program.id));")

          assignment_create=$(curl -fsS -X POST http://127.0.0.1:4000/assignments \
            -H "content-type: application/json" \
            -H "authorization: Bearer $trainer_token" \
            -d "{\"programId\":\"$program_id\",\"studentId\":\"$student_id\"}")
          echo "$assignment_create" | grep '"isActive":true'

          current_workout=$(curl -fsS http://127.0.0.1:4000/students/me/current-workout \
            -H "authorization: Bearer $student_token")
          assignment_id=$(echo "$current_workout" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).assignment.id));")
          workout_exercise_id=$(echo "$current_workout" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).assignment.program.workouts[0].exercises[0].id));")

          report_submit=$(curl -fsS -X POST http://127.0.0.1:4000/reports/submit \
            -H "content-type: application/json" \
            -H "authorization: Bearer $student_token" \
            -d "{\"assignmentId\":\"$assignment_id\",\"idempotencyKey\":\"smoke-key-001\",\"workoutStatus\":\"completed\",\"executions\":[{\"workoutExerciseId\":\"$workout_exercise_id\",\"status\":\"done\",\"actualReps\":10}],\"wellbeing\":{\"score\":4,\"label\":\"ok\"}}")
          report_id=$(echo "$report_submit" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).report.id));")

          png_path="/tmp/smoke.png"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO7+KXcAAAAASUVORK5CYII=' | base64 -d > "$png_path"

          attachment_create=$(curl -fsS -X POST "http://127.0.0.1:4000/reports/$report_id/attachments" \
            -H "authorization: Bearer $student_token" \
            -F "file=@$png_path;type=image/png")
          attachment_id=$(echo "$attachment_create" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).attachment.id));")

          curl -fsS "http://127.0.0.1:4000/attachments/$attachment_id/content" \
            -H "authorization: Bearer $trainer_token" \
            -o /tmp/downloaded_smoke.png
          test -s /tmp/downloaded_smoke.png

      - name: Print API log on failure
        if: failure()
        run: cat api.log

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then kill "$(cat api.pid)" || true; fi
