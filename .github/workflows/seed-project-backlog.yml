name: Seed MVP Backlog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project/mvp-issues.json"
      - ".github/workflows/seed-project-backlog.yml"

permissions:
  contents: read
  issues: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed labels and issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const labelMap = {
              "type:epic": { color: "5319e7", description: "Large outcome-oriented workstream" },
              "type:task": { color: "0e8a16", description: "Deliverable task item" },
              "prio:p0": { color: "b60205", description: "Critical priority" },
              "prio:p1": { color: "d93f0b", description: "High priority" },
              "prio:p2": { color: "fbca04", description: "Medium priority" },
              "status:todo": { color: "cfd3d7", description: "Ready to start" },
              "status:in-progress": { color: "1d76db", description: "Actively in work" },
              "status:done": { color: "0e8a16", description: "Completed" },
              "area:auth": { color: "0052cc", description: "Auth and access control" },
              "area:groups-invites": { color: "0052cc", description: "Groups and invite flow" },
              "area:programs": { color: "0052cc", description: "Programs and assignments" },
              "area:reports": { color: "0052cc", description: "Reports and execution logging" },
              "area:triggers": { color: "0052cc", description: "Triggers and attention queue" },
              "area:media": { color: "0052cc", description: "Uploads and media access" },
              "area:infra": { color: "0052cc", description: "Infrastructure and CI/CD" }
            };

            const raw = fs.readFileSync("project/mvp-issues.json", "utf8");
            const items = JSON.parse(raw);

            // Ensure labels exist
            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existingNames = new Set(existingLabels.map(l => l.name));

            for (const [name, cfg] of Object.entries(labelMap)) {
              if (existingNames.has(name)) continue;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color: cfg.color,
                description: cfg.description
              });
              core.info(`Created label: ${name}`);
            }

            // Create missing issues by exact title match
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100
            });
            const existingTitles = new Set(
              allIssues
                .filter(i => !i.pull_request)
                .map(i => i.title)
            );

            let created = 0;
            for (const item of items) {
              if (existingTitles.has(item.title)) {
                core.info(`Skip existing issue: ${item.title}`);
                continue;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: item.title,
                body: item.body,
                labels: item.labels || []
              });
              created += 1;
              core.info(`Created issue: ${item.title}`);
            }

            core.notice(`Seeding complete. Created ${created} issue(s).`);
