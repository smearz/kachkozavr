name: Sync Issue Status Labels From PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync_labels:
    runs-on: ubuntu-latest
    steps:
      - name: Parse linked issue numbers
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const regex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const found = new Set();
            let m;
            while ((m = regex.exec(body)) !== null) {
              found.add(Number(m[1]));
            }
            core.setOutput("issues", JSON.stringify([...found]));

      - name: Update issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const issues = JSON.parse(`${{ steps.parse.outputs.issues }}`);
            const isMerged = context.payload.action === "closed" && context.payload.pull_request.merged;
            const isActive = ["opened", "reopened", "ready_for_review"].includes(context.payload.action);

            for (const issue_number of issues) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number
              });

              const labels = issue.labels.map(l => typeof l === "string" ? l : l.name);
              const next = labels.filter(l => !["status:todo", "status:in-progress", "status:done"].includes(l));

              if (isMerged) next.push("status:done");
              if (isActive) next.push("status:in-progress");

              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                labels: [...new Set(next)]
              });
            }
