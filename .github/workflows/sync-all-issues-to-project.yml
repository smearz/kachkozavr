name: Sync All Issues To Project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-all-issues-to-project.yml"
      - "project/mvp-issues.json"
      - ".github/workflows/seed-project-backlog.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync open issues into Project v2
        uses: actions/github-script@v7
        env:
          PROJECT_V2_URL: ${{ vars.PROJECT_V2_URL }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const projectUrl = process.env.PROJECT_V2_URL;
            if (!projectUrl) {
              core.setFailed("PROJECT_V2_URL variable is not set.");
              return;
            }

            const match = projectUrl.match(/^https:\/\/github\.com\/(users|orgs)\/([^/]+)\/projects\/(\d+)(?:\/views\/\d+)?$/);
            if (!match) {
              core.setFailed(`Unsupported PROJECT_V2_URL format: ${projectUrl}`);
              return;
            }

            const ownerType = match[1]; // users | orgs
            const ownerLogin = match[2];
            const projectNumber = Number(match[3]);

            async function getProjectId() {
              if (ownerType === "users") {
                const q = `
                  query($login: String!, $number: Int!) {
                    user(login: $login) {
                      projectV2(number: $number) { id }
                    }
                  }
                `;
                const res = await github.graphql(q, { login: ownerLogin, number: projectNumber });
                return res?.user?.projectV2?.id;
              }
              const q = `
                query($login: String!, $number: Int!) {
                  organization(login: $login) {
                    projectV2(number: $number) { id }
                  }
                }
              `;
              const res = await github.graphql(q, { login: ownerLogin, number: projectNumber });
              return res?.organization?.projectV2?.id;
            }

            const projectId = await getProjectId();
            if (!projectId) {
              core.setFailed(`Project not found for URL: ${projectUrl}`);
              return;
            }

            // Collect issue content IDs that are already in project
            const existingIssueIds = new Set();
            let cursor = null;
            while (true) {
              const q = `
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          content {
                            ... on Issue { id number }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              const res = await github.graphql(q, { projectId, cursor });
              const items = res?.node?.items?.nodes || [];
              for (const item of items) {
                const content = item?.content;
                if (content?.id) existingIssueIds.add(content.id);
              }
              const pageInfo = res?.node?.items?.pageInfo;
              if (!pageInfo?.hasNextPage) break;
              cursor = pageInfo.endCursor;
            }

            // Collect open issues in current repo
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const onlyIssues = issues.filter(i => !i.pull_request);

            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            let added = 0;
            let skippedConflicts = 0;
            for (const issue of onlyIssues) {
              if (existingIssueIds.has(issue.node_id)) continue;

              let success = false;
              const maxAttempts = 5;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  await github.graphql(
                    `
                      mutation($projectId: ID!, $contentId: ID!) {
                        addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                          item { id }
                        }
                      }
                    `,
                    { projectId, contentId: issue.node_id }
                  );
                  added += 1;
                  success = true;
                  core.info(`Added issue #${issue.number} to project`);
                  break;
                } catch (err) {
                  const msg = String(err && err.message ? err.message : err);
                  const isTempConflict =
                    msg.includes("temporary conflict") ||
                    msg.includes("already exists");

                  if (isTempConflict && attempt < maxAttempts) {
                    const waitMs = attempt * 800;
                    core.warning(`Conflict while adding #${issue.number}, retry ${attempt}/${maxAttempts} after ${waitMs}ms`);
                    await sleep(waitMs);
                    continue;
                  }

                  if (isTempConflict) {
                    skippedConflicts += 1;
                    core.warning(`Skipping #${issue.number} due to repeated project conflict`);
                    success = true;
                    break;
                  }

                  throw err;
                }
              }

              if (!success) {
                core.warning(`Issue #${issue.number} not added`);
              }
            }

            core.notice(`Sync done. Added ${added} issue(s) to project. Skipped conflicts: ${skippedConflicts}.`);
